# =============================================================================
# .github/workflows/harness.yml  —  caller workflow (lives in the SERVICE repo)
# Thin: it only pins toolchain versions and calls the shared engine workflow.
# Everything service-specific (modules, paths, globs) is in .harness/config.yaml.
# =============================================================================
name: Harness

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id to run"
        required: true

jobs:
  harness:
    uses: bcbsm/harness-engine/.github/workflows/harness.yml@v1
    with:
      # Toolchain versions live HERE, not in config.yaml — CI setup steps
      # (actions/setup-java etc.) run before config.yaml is parsed.
      java-version: "17"        # BCBSM backend services are Java 17
      python-version: "3.13"
      node-version: "20"
      feature_id: ${{ inputs.feature_id }}
    secrets: inherit            # COPILOT_GITHUB_TOKEN provided at org/repo level
